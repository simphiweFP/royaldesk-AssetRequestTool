name: RoyalDesk CI

on:
  push:
    branches: [main, feature/royaldesk-asset-lifecycle]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore RoyalDesk.sln
      - name: Build
        run: dotnet build RoyalDesk.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test RoyalDesk.sln --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: royaldesk-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Build Angular
        run: npm run build
