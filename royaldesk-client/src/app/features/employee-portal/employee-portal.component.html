<div class="employee-portal">
  <header class="portal-header">
    <img src="assets/images/royal-tyres-logo-final.png" alt="Royal Tyres" />
    <button type="button" (click)="openStaff()">Staff Access</button>
  </header>

  <section class="portal-hero" *ngIf="mode==='home'">
    <div>
      <h1><span>Royal</span>Desk</h1>
      <h2>What do you need today?</h2>
      <p>Choose one simple option. RoyalDesk will only show the information needed for that request.</p>
    </div>
  </section>

  <section class="portal-actions" *ngIf="mode==='home'">
    <button type="button" (click)="openRequest('Incident')"><strong>Report a Problem</strong><span>Something is not working: SAP, printer, network, email, PC or another IT issue.</span></button>
    <button type="button" (click)="openRequest('Equipment')"><strong>Request Equipment</strong><span>Laptop, monitor, keyboard, headset, printer or other IT equipment.</span></button>
    <button type="button" (click)="openRequest('Service')"><strong>Request IT Service</strong><span>Access, software, stock code creation, shared folders, advice or another IT service.</span></button>
    <button type="button" (click)="mode='track'"><strong>Track My Request</strong><span>Check progress, technician ownership and public updates.</span></button>
  </section>

  <section class="embedded" *ngIf="mode==='request'">
    <button class="back" type="button" (click)="mode='home'">← Employee Portal</button>
    <app-asset-request [requestType]="requestType"></app-asset-request>
  </section>

  <section class="embedded tracking" *ngIf="mode==='track'">
    <button class="back" type="button" (click)="mode='home'">← Employee Portal</button>
    <app-ticket-tracking></app-ticket-tracking>
  </section>
</div>
